version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: deepagent_postgres
    environment:
      POSTGRES_USER: deepagent
      POSTGRES_PASSWORD: deepagent
      POSTGRES_DB: deepagentstudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepagent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deepagent_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deepagent_backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://deepagent:deepagent@postgres:5432/deepagentstudio
      JWT_SECRET_KEY: dev-secret-key-change-in-production-min-32-chars-required
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      # Valid Fernet key for development (generate new one for production)
      ENCRYPTION_KEY: u3Uc-qAi9yCMm7XIp7-jMwPlJzYyiMn2B0xXhZ_BbRA=
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:5173
      ENVIRONMENT: development
      # LLM Provider API Keys (loaded from .env file if present)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - deepagent_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepagent_frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - deepagent_network

volumes:
  postgres_data:

networks:
  deepagent_network:
    driver: bridge
